<!DOCTYPE html>
<html>
<head>
    <title>Teste API</title>
</head>
<body>
    <h2>Teste Registro</h2>
    <button onclick="testar()">Registrar</button>
    <pre id="resultado"></pre>

    <script>
        async function testar() {
            const data = {
                name: "Usuario Teste",
                email: "usuarioteste@exemplo.com",
                password: "Admin@123",
                confirm_password: "Admin@123"
            };
            
            try {
                const response = await fetch('http://localhost:8000/api/auth.php?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('resultado').innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('resultado').innerText = 'Erro: ' + error.message;
            }
        }
    </script>
</body>
</html>
